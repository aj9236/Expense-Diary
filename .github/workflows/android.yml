name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          if [ -n "$ANDROID_SIGNING" ]; then
            echo "$ANDROID_SIGNING" | sed -n '1p' | tr -d '\r\n' > pw.txt
            echo "$ANDROID_SIGNING" | sed -n '2,$p' | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNED_WITH=permanent" >> "$GITHUB_ENV"
          else
            openssl rand -base64 18 | tr -d '\n' > pw.txt
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 \
              -storepass "$(cat pw.txt)" -keypass "$(cat pw.txt)" -alias expensediary \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Expense Diary Test"
            echo "SIGNED_WITH=temporary" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$(cat pw.txt)"
          echo "EXPENSE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "EXPENSE_KEYSTORE_PASSWORD=$(cat pw.txt)" >> "$GITHUB_ENV"
          rm pw.txt

      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ExpenseDiary.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ExpenseDiary-apk
          path: out/ExpenseDiary.apk

      - name: Publish download
        if: env.SIGNED_WITH == 'permanent'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Expense Diary for Android (build ${{ github.run_number }})
          body: Install ExpenseDiary.apk on the Android phone. Updates install over the previous version and keep all settings.
          files: out/ExpenseDiary.apk
          make_latest: true
